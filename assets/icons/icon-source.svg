    <rect x="354" y="404" width="332" height="34" rx="17" fill="#C6CED7" opacity="0.72"/>
    <rect x="354" y="466" width="284" height="34" rx="17" fill="#D6DEE7" opacity="0.82"/>
    <path d="M359 586 C421 524 467 524 529 586 C583 640 631 642 688 586" fill="none" stroke="url(#relayBlue)" stroke-width="40" stroke-linecap="round"/>
