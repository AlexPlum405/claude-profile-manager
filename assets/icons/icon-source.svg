    <rect x="354" y="278" width="430" height="454" rx="86" fill="url(#middleCard)" transform="rotate(8 569 505)" opacity="0.96"/>
    <rect x="260" y="252" width="504" height="492" rx="94" fill="url(#frontCard)" transform="rotate(-4 512 498)"/>
    <rect x="284" y="279" width="456" height="438" rx="78" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="8" transform="rotate(-4 512 498)"/>
