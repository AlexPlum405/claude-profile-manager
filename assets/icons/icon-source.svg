<svg viewBox="0 0 1024 1024" role="img" aria-label="Clave Profile Relay app icon" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baseGradient" x1="156" y1="98" x2="856" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBFEFF"/>
      <stop offset="0.28" stop-color="#DAF0FF"/>
      <stop offset="0.62" stop-color="#2A9DFF"/>
      <stop offset="1" stop-color="#0071E3"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 760) rotate(-128) scale(390)">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.88"/>
      <stop offset="0.52" stop-color="#10B981" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="topLight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(278 148) rotate(34) scale(350 196)">
