<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clave Pro: Aero Edition</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Background Soul: Floating Blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>
  <div class="texture-overlay"></div>
  
  <div class="window">
    <!-- Title Bar / Command Bar -->
    <header class="command-bar">
      <div class="brand-zone">
        <div class="traffic-lights" aria-label="窗口控制">
          <button class="dot red" type="button" onclick="closeWindow()" aria-label="关闭窗口" title="关闭"></button>
          <button class="dot yellow" type="button" onclick="minimizeWindow()" aria-label="最小化窗口" title="最小化"></button>
          <button class="dot green" type="button" onclick="maximizeWindow()" aria-label="最大化或还原窗口" title="最大化/还原"></button>
        </div>
        <span class="brand-name">Clave Pro</span>
      </div>
      
      <div class="search-container">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color: var(--text-muted)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="profileSearch" type="text" placeholder="搜索配置 (CMD + K)..." autocomplete="off" />
      </div>
      
      <div class="window-actions">
        <div class="theme-picker" id="themeSwitcher">
          <div class="swatch" data-theme-value="azure" style="background: #007AFF" onclick="setTheme('azure')" title="蔚蓝"></div>
          <div class="swatch" data-theme-value="emerald" style="background: #10B981" onclick="setTheme('emerald')" title="翡翠"></div>
          <div class="swatch" data-theme-value="silver" style="background: #636366" onclick="setTheme('silver')" title="银石墨"></div>
        </div>
      </div>
    </header>

    <div class="workspace">
      <!-- Sidebar Nav -->
      <nav class="profile-nav">
        <div class="nav-section-title">我的配置集合</div>
        <div class="nav-list" id="profileList">
          <!-- Profiles injected by renderer.js -->
        </div>
        
        <footer class="nav-footer">
          <button class="btn-icon" onclick="createNewProfile()" title="新建配置">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right: 6px;"><path d="M12 5v14M5 12h14"/></svg>
            <span style="font-size:12px; font-weight:600;">新建配置</span>
          </button>
          <div style="display:flex; gap: 4px;">
            <button class="btn-icon" onclick="refreshAll()" title="刷新列表">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            </button>
            <button class="btn-icon" onclick="openFolder()" title="打开配置文件目录">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
            </button>
          </div>
        </footer>
      </nav>

      <!-- Editor Area -->
      <main class="editor-area">
        <div id="testProgressBar"></div>
        
        <header class="editor-header">
          <div class="editor-title-group">
            <div id="activeBadge" class="status-badge hidden">EDITING VERSION · ACTIVE</div>
            <input id="profileTitle" class="editable-title" type="text" placeholder="未命名配置" readonly />
          </div>
          <div class="editor-actions">
            <button class="btn-action btn-secondary" onclick="saveCurrent()">保存</button>
            <button id="testBtn" class="btn-action btn-secondary" onclick="testCurrent()">测试连接</button>
            <button class="btn-action btn-primary" onclick="activateCurrent()">立即激活</button>
            <div class="more-menu-shell">
              <button id="profileMoreButton" class="btn-action btn-more" type="button" onclick="toggleProfileMoreMenu(event)" aria-label="更多配置操作" aria-haspopup="menu" aria-expanded="false" title="更多">···</button>
              <div id="profileMoreMenu" class="profile-more-menu hidden" role="menu" aria-label="更多配置操作">
                <button type="button" role="menuitem" onclick="handleMoreMenuAction(importProfiles)">导入配置<span>⌘O</span></button>
                <button type="button" role="menuitem" onclick="handleMoreMenuAction(exportCurrentProfile)">导出当前<span>⌘E</span></button>
                <button type="button" role="menuitem" onclick="handleMoreMenuAction(exportAllProfiles)">批量导出<span>⇧⌘E</span></button>
                <div class="menu-separator" role="separator"></div>
                <button class="danger" type="button" role="menuitem" onclick="handleMoreMenuAction(deleteCurrent)">删除配置</button>
              </div>
            </div>
          </div>
        </header>

        <div class="editor-scroll-area">
          <div class="input-card">
            <div class="input-group" style="display:flex; flex-direction:column; gap:8px;">
              <label class="input-group-label">配置名称 (Profile Name)</label>
              <input id="profileName" class="input-field" type="text" placeholder="例如：商汤U1" />
              <div id="profileNameHint" class="input-hint">名称会用于 settings.&lt;name&gt;.json 文件名。</div>
            </div>
            <div class="input-group" style="display:flex; flex-direction:column; gap:8px;">
              <label class="input-group-label">基础地址 (Endpoint URL)</label>
              <input id="baseUrl" class="input-field" type="text" placeholder="https://api.anthropic.com" />
              <div id="baseUrlHint" class="input-hint">填写 /v1/messages 前面的地址，Clave 会自动移除完整端点。</div>
            </div>
            <div class="input-group" style="display:flex; flex-direction:column; gap:8px;">
              <label class="input-group-label">认证令牌 (Auth Token)</label>
              <input id="apiKey" class="input-field" type="password" placeholder="sk-ant-..." />
            </div>
          </div>

          <section id="diagnosticPanel" class="diagnostic-panel hidden">
            <div class="panel-head">
              <div>
                <div class="input-group-label">连接诊断</div>
                <div id="diagnosticSummary" class="panel-subtitle">等待测试结果</div>
              </div>
              <button class="btn-action btn-secondary btn-small" onclick="clearDiagnostics()">清除</button>
            </div>
            <div id="diagnosticDetails" class="diagnostic-details"></div>
          </section>

          <div class="json-panel">
            <div class="panel-head">
              <div>
                <label class="input-group-label">高级 JSON 配置</label>
                <div id="jsonStatus" class="panel-subtitle">JSON 已就绪</div>
              </div>
              <div class="toolbar-actions">
                <button class="btn-action btn-secondary btn-small" onclick="formatJsonEditor()">格式化</button>
                <button class="btn-action btn-secondary btn-small" onclick="validateJsonEditor()">校验</button>
              </div>
            </div>
            <div class="json-editor-shell">
              <textarea id="profileJson" class="json-textarea" spellcheck="false"></textarea>
              <div id="jsonBracketMarkers" class="bracket-marker-layer" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Status Bar Footer -->
    <footer class="status-footer">
      <div style="display:flex; align-items:center;">
        <div class="status-dot"></div>
        <span id="footerHint">状态：已就绪</span>
      </div>
      <div id="rootPathHint">Claude Root: ~/.claude</div>
    </footer>
  </div>

  <!-- Toast Notification -->
  <div id="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
    <span id="toastMessage">配置已成功激活</span>
  </div>

  <div id="dropOverlay" class="drop-overlay hidden">
    <div class="drop-card">
      <div class="drop-title">释放以导入配置</div>
      <div class="drop-subtitle">支持多个 settings.*.json 文件或 Clave ZIP 包</div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
