<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clave</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="window">
    <!-- Titlebar -->
    <div class="titlebar">
      <div class="app-title">
        <img src="../assets/icons/icon.png" class="app-icon" alt="Clave">
        <span class="title-text">Clave</span>
      </div>
      <div class="badge" id="status">配置已同步</div>
      <div class="window-buttons">
        <button class="win-btn" onclick="refreshAll()">刷新</button>
        <button class="win-btn" onclick="openFolder()">打开文件夹</button>
      </div>
      <div class="window-controls">
        <button class="control-btn minimize-btn" onclick="minimizeWindow()" title="最小化">
          <svg width="10" height="10" viewBox="0 0 12 12"><rect x="1" y="5.5" width="10" height="1" fill="currentColor"/></svg>
        </button>
        <button class="control-btn maximize-btn" onclick="maximizeWindow()" title="最大化/还原">
          <svg width="10" height="10" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button class="control-btn close-btn" onclick="closeWindow()" title="关闭">
          <svg width="10" height="10" viewBox="0 0 12 12"><path d="M2,2 L10,10 M10,2 L2,10" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
        </button>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Content -->
    <div class="content">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title">配置列表</div>
          <div class="sidebar-subtitle">快速切换与编辑</div>
        </div>
        <div class="sidebar-list" id="profileList"></div>
      </div>

      <!-- Main -->
      <div class="main">
        <div class="main-title">编辑配置</div>
        <div class="main-subtitle">修改名称、地址、密钥和原始 JSON</div>
        <div class="main-fields">
          <div class="info-card">
            <div class="info-label">配置名称</div>
            <input id="profileName" class="info-input" type="text" placeholder="例如：en01" />
          </div>
          <div class="info-card">
            <div class="info-label">基础地址</div>
            <input id="baseUrl" class="info-input" type="text" placeholder="https://en01.imds.ai/" />
          </div>
          <div class="info-card">
            <div class="info-label">API 密钥</div>
            <input id="apiKey" class="info-input" type="text" placeholder="sk-..." />
          </div>
        </div>
        <div class="json-card">
          <div class="json-label">原始 settings.json</div>
          <textarea id="profileJson" class="json-body" spellcheck="false"></textarea>
        </div>
      </div>
    </div>

    <!-- Statusbar -->
    <div class="statusbar">
      <span class="status-text" id="footerHint">状态：未检测到激活配置</span>
      <div class="action-buttons">
        <button class="btn btn-save" onclick="saveCurrent()">保存</button>
        <button class="btn btn-new" onclick="createNewProfile()">新建</button>
        <button class="btn btn-delete" onclick="deleteCurrent()">删除</button>
        <button class="btn btn-test" onclick="testCurrent()">测试</button>
        <button class="btn btn-activate" onclick="activateCurrent()">激活</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
